# Paket B «Server» (Noah 18.10.2026 «2 immer sofort ohne bilder und ohne mein ok»): a library update from
# Dependabot merges by itself as soon as the required checks (build, e2e) are green. The one exception to
# «Noah merges every PR himself», for Dependabot's pull requests only. Needs «Allow auto-merge» in the
# repository settings (anleitung.md Teil 8). Only GITHUB_TOKEN.
# A merge made with GITHUB_TOKEN starts no push workflow, so deploy.yml would wait for the next normal merge
# (Noah 18.10.2026: updates go online right away). The job therefore waits until the pull request is merged
# and then starts deploy.yml on main by hand (workflow_dispatch is the one event GITHUB_TOKEN may start).
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write
  actions: write

# a newer push to the same pull request (Dependabot rebases) replaces the waiting run
concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Turn on auto-merge
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
      - name: Wait for the merge, then deploy main
        run: |
          for i in $(seq 1 110); do
            state=$(gh pr view "$PR_URL" --json state --jq .state)
            if [ "$state" = "MERGED" ]; then
              gh workflow run deploy.yml --ref main --repo "$GITHUB_REPOSITORY"
              echo "merged, deploy.yml started on main"
              exit 0
            fi
            if [ "$state" = "CLOSED" ]; then echo "closed without merge, nothing to deploy"; exit 0; fi
            sleep 60
          done
          echo "not merged after 110 minutes (checks red or still running): no deploy from here"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
