# Volle Prüfung (Noah 27.10.2026 «1a 2a», thread «Weg von gebaut zu online»): the browser tests that no
# longer hold up going online. They ran after every publish of main.
# Noah 03.11.2026 «2a» (thread «Prüfen: Warum die Tests langsam sind»): since then only once a night
# (02:07 UTC) or by hand («Run workflow»). After every merge it took 9 of the 20 GitHub computers on top of
# the pull request checks, and the queue was 40 minutes long. It runs the phone and computer browser tests
# (5 parts each) and the Gesamttest (phone and computer, 2 parts each) on main as it is then.
# Only on a failure it opens an issue (or adds to the open one), so Noah gets a mail and Claude repairs
# it (or Noah says «zurück»). When all is fine again, it closes the issue. Only GITHUB_TOKEN, no secret.
name: Volle Prüfung

on:
  schedule:
    - cron: '7 2 * * *' # every night 02:07 UTC, after the Nacht-Rundgang has started
  workflow_dispatch:

permissions:
  issues: write
  contents: read
  actions: read # the report reads the jobs of this run and the last green run

# One runs, the newest waits; an older waiting one is replaced (the newer version holds its changes).
concurrency:
  group: volle-pruefung
  cancel-in-progress: false

jobs:
  e2e-part:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The tag must match @playwright/test in package.json (tests/ci-image.test.js).
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        project: [phone, desktop]
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the whole history: scripts/news.mjs numbers versions by the order of merges
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run e2e -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}/5
        env:
          E2E_SKIP_GESAMTTEST: '1' # its own job below
      # Failed and flaky (passed only on the retry) tests by name, in the summary of the run
      - if: always()
        run: node scripts/test-summary.mjs pw-report.json "${{ matrix.project }} part ${{ matrix.shard }}" rot-e2e-${{ matrix.project }}-${{ matrix.shard }}.txt
      # The names of the failed tests: the report job compares them with the night before (scripts/nacht-vergleich.mjs)
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rot-e2e-${{ matrix.project }}-${{ matrix.shard }}
          path: rot-e2e-${{ matrix.project }}-${{ matrix.shard }}.txt
          retention-days: 2
          if-no-files-found: ignore
      - if: failure()
        run: for f in test-results/*/error-context.md; do echo "::group::$f"; head -c 20000 "$f"; echo "::endgroup::"; done
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: voll-e2e-${{ matrix.project }}-${{ matrix.shard }}
          path: test-results
          retention-days: 1 # Noah 11.10.2026: 0 costs, small storage

  # v0.45.1: the Gesamttest with the big fictional data set (tests/e2e/gesamttest, 700 items).
  gesamttest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        project: [phone, desktop]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright test tests/e2e/gesamttest --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2
      - if: always()
        run: node scripts/test-summary.mjs pw-report.json "gesamttest ${{ matrix.project }} ${{ matrix.shard }}" rot-gesamttest-${{ matrix.project }}-${{ matrix.shard }}.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rot-gesamttest-${{ matrix.project }}-${{ matrix.shard }}
          path: rot-gesamttest-${{ matrix.project }}-${{ matrix.shard }}.txt
          retention-days: 2
          if-no-files-found: ignore
      - if: failure()
        run: for f in test-results/*/error-context.md; do echo "::group::$f"; head -c 20000 "$f"; echo "::endgroup::"; done
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: voll-gesamttest-${{ matrix.project }}-${{ matrix.shard }}
          path: test-results
          retention-days: 1

  report:
    needs: [e2e-part, gesamttest]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      LABEL: volle-pruefung
      SHA: ${{ github.sha }}
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7 # scripts/nacht-vergleich.mjs
      - name: Write the report
        run: |
          {
            echo "### Volle Prüfung $(date -u +'%Y-%m-%d %H:%M') UTC"
            echo
            echo "Version auf main: \`${SHA:0:8}\` · Anlass: ${{ github.event_name == 'schedule' && 'Nacht' || 'von Hand' }}"
            echo
            echo "- Browsertests: ${{ needs.e2e-part.result }}"
            echo "- Gesamttest: ${{ needs.gesamttest.result }}"
            echo
            echo "Ganzer Lauf: $RUN"
          } > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      # 21.11.2026 (Noah «d plus b»): the night run was red every night from 3 to 21 November. One old issue got a comment
      # per night, and a new red test hid between the old ones. Now every job leaves the names of its failed tests; this
      # step compares them with the night before. The issue gets a comment (a mail) only when something is NEW red.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: rot-*
          merge-multiple: true
          path: rot
      - name: Compare with the night before
        id: vergleich
        run: |
          mkdir -p vorher
          prev=''
          for id in $(gh run list --workflow volle-pruefung.yml --status completed --limit 6 --json databaseId --jq '.[].databaseId'); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            if gh run download "$id" -n rot-liste -D vorher 2>/dev/null; then prev="$id"; break; fi
          done
          prev_sha=''
          [ -n "$prev" ] && prev_sha=$(gh run view "$prev" --json headSha --jq .headSha || true)
          echo "prev_sha=$prev_sha" >> "$GITHUB_OUTPUT"
          # 14 jobs leave a list: 10 browser parts + 4 Gesamttest parts
          node scripts/nacht-vergleich.mjs rot "${prev:+vorher/rot-liste.txt}" rot-liste.txt 14 > vergleich.md
          cat vergleich.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rot-liste
          path: rot-liste.txt
          retention-days: 7
          if-no-files-found: ignore
      # Noah 04.11.2026 «Test-Plan 4»: a red night run says in one line what is red and which merged PRs came
      # since the last run, so the morning starts with the suspects and not with a search.
      # 21.11.2026: since the night before (not since the last GREEN run: that was 18 days back, «232 weitere»).
      - name: Name the suspects
        if: needs.e2e-part.result != 'success' || needs.gesamttest.result != 'success'
        env:
          PREV_SHA: ${{ steps.vergleich.outputs.prev_sha }}
        run: |
          failed=$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --jq '[.jobs[] | select((.conclusion == "failure" or .conclusion == "cancelled") and .name != "report") | .name + (if .conclusion == "cancelled" then " (Zeitlimit)" else "" end)] | join(", ")' || true)
          good=$(gh run list --workflow volle-pruefung.yml --status success --limit 1 --json headSha --jq '.[0].headSha // empty' || true)
          from="${PREV_SHA:-$good}"
          suspects=''
          if [ -n "$from" ] && [ "$from" != "$SHA" ]; then
            suspects=$(gh api "repos/$GH_REPO/compare/$from...$SHA" --jq '[.commits[].commit.message | split("\n")[0] | select(test("\\(#[0-9]+\\)$"))] | if length > 12 then (.[0:12] | join("; ")) + "; und \(length - 12) weitere" else join("; ") end' || true)
          fi
          {
            cat vergleich.md
            echo
            echo "Rot: ${failed:-(Lauf ansehen)}."
            echo
            if [ -n "$suspects" ]; then
              echo "Verdächtig, seit der letzten Nacht auf main gemerged: $suspects"
            elif [ -z "$from" ]; then
              echo "Verdächtig: nicht bekannt (es gibt noch keinen früheren Lauf zum Vergleichen)."
            else
              echo "Seit dem letzten Lauf (\`${from:0:8}\`) ist nichts Neues auf main: vermutlich ein Wackler."
            fi
            echo
            cat report.md
          } > report-new.md
          mv report-new.md report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Open or update the issue
        if: needs.e2e-part.result != 'success' || needs.gesamttest.result != 'success'
        env:
          NEU: ${{ steps.vergleich.outputs.neu }}
          ERSTER: ${{ steps.vergleich.outputs.erster }}
          UNVOLLSTAENDIG: ${{ steps.vergleich.outputs.unvollstaendig }}
        run: |
          gh label create "$LABEL" --color D93F0B --description 'Die volle Prüfung nach dem Online-Gehen hat einen Fehler gefunden' 2>/dev/null || true
          num=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            # a comment sends a mail: only when something is new red, at the first comparison, or when a job left no list
            if [ "${NEU:-0}" != "0" ] || [ "$ERSTER" = "yes" ] || [ "$UNVOLLSTAENDIG" = "yes" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              gh issue comment "$num" --body-file report.md
            else
              echo "Nothing new red since the night before: no new mail."
            fi
          else
            {
              echo 'Die volle Prüfung hat an der Version, die online ist, einen Fehler gefunden. Claude repariert ihn mit einem kleinen PR. Ist es dringend, sag «zurück».'
              echo
              cat report.md
            } > body.md
            gh issue create --title 'Volle Prüfung: ein Test ist rot' --label "$LABEL" --body-file body.md
          fi
      - name: Close the issue when all is fine again
        if: needs.e2e-part.result == 'success' && needs.gesamttest.result == 'success'
        run: |
          for num in $(gh issue list --label "$LABEL" --state open --json number --jq '.[].number'); do
            gh issue close "$num" --comment "Alles wieder grün.$(printf '\n\n')$(cat report.md)"
          done
