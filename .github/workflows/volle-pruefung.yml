# Volle Prüfung (Noah 27.10.2026 «1a 2a», thread «Weg von gebaut zu online»): the browser tests that no
# longer hold up going online. They ran after every publish of main.
# Noah 03.11.2026 «2a» (thread «Prüfen: Warum die Tests langsam sind»): since then only once a night
# (21:17 UTC since 24.11.2026) or by hand («Run workflow»). After every merge it took 9 of the 20 GitHub computers on top of
# the pull request checks, and the queue was 40 minutes long. It runs the phone and computer browser tests
# (7 parts each since 21.11.2026) and the Gesamttest (phone and computer, 6 parts each since 26.11.2026) on main as it is then.
# Only on a failure it opens an issue (or adds to the open one), so Noah gets a mail and Claude repairs
# it (or Noah says «zurück»). When all is fine again, it closes the issue. Only GITHUB_TOKEN, no secret.
name: Volle Prüfung

on:
  schedule:
    # 24.11.2026 (Noah «a-c alle», c = Nachtlauf): the scheduled runs of the last 20 nights did not start at 02:07 but between
    # 08:39 and 10:31 UTC (once 12:21), so the result came at noon, not in the morning. Now the start is set to the evening
    # (21:17 UTC = 22:17 in Zurich in winter); with the same delay it runs in the night and is done before the morning round at 08:00.
    - cron: '17 21 * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read
  actions: read # the report reads the jobs of this run and the last green run

# One runs, the newest waits; an older waiting one is replaced (the newer version holds its changes).
concurrency:
  group: volle-pruefung
  cancel-in-progress: false

jobs:
  e2e-part:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The tag must match @playwright/test in package.json (tests/ci-image.test.js).
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        project: [phone, desktop]
        # 7 parts since 21.11.2026 (Noah «1a»): with 5 two parts hit the 45 minute limit in the night run of 21.11.
        # and their tests were never checked (the report said «red» without naming them)
        shard: [1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the whole history: scripts/news.mjs numbers versions by the order of merges
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run e2e -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}/7
        env:
          E2E_SKIP_GESAMTTEST: '1' # its own job below
          E2E_SKIP_AUSPROBIEREN: '1' # its own job below (24.11.2026, see «ausprobieren»)
      # Failed and flaky (passed only on the retry) tests by name, in the summary of the run
      - if: always()
        run: node scripts/test-summary.mjs pw-report.json "${{ matrix.project }} part ${{ matrix.shard }}" rot-e2e-${{ matrix.project }}-${{ matrix.shard }}.txt wackel-e2e-${{ matrix.project }}-${{ matrix.shard }}.txt
      # The names of the failed tests: the report job compares them with the night before (scripts/nacht-vergleich.mjs)
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rot-e2e-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            rot-e2e-${{ matrix.project }}-${{ matrix.shard }}.txt
            wackel-e2e-${{ matrix.project }}-${{ matrix.shard }}.txt
          retention-days: 2
          if-no-files-found: ignore
      - if: failure()
        run: for f in test-results/*/error-context.md; do echo "::group::$f"; head -c 20000 "$f"; echo "::endgroup::"; done
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: voll-e2e-${{ matrix.project }}-${{ matrix.shard }}
          path: test-results
          retention-days: 1 # Noah 11.10.2026: 0 costs, small storage

  # v0.45.1: the Gesamttest with the big fictional data set (tests/e2e/gesamttest, 700 items).
  gesamttest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        project: [phone, desktop]
        # 6 parts since 26.11.2026 (test plan «Tests auf den neuen App-Stand bringen», step 3): the Gesamttest now also opens every address
        # of the app's code (alle-seiten.spec.js, about 220 cases: 16 minutes on the computer, 24 on the phone with 3 workers) and the window
        # test with four times of day. With 2 parts the phone parts would pass the 30 minutes.
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright test tests/e2e/gesamttest --project=${{ matrix.project }} --shard=${{ matrix.shard }}/6
      - if: always()
        run: node scripts/test-summary.mjs pw-report.json "gesamttest ${{ matrix.project }} ${{ matrix.shard }}" rot-gesamttest-${{ matrix.project }}-${{ matrix.shard }}.txt wackel-gesamttest-${{ matrix.project }}-${{ matrix.shard }}.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rot-gesamttest-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            rot-gesamttest-${{ matrix.project }}-${{ matrix.shard }}.txt
            wackel-gesamttest-${{ matrix.project }}-${{ matrix.shard }}.txt
          retention-days: 2
          if-no-files-found: ignore
      - if: failure()
        run: for f in test-results/*/error-context.md; do echo "::group::$f"; head -c 20000 "$f"; echo "::endgroup::"; done
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: voll-gesamttest-${{ matrix.project }}-${{ matrix.shard }}
          path: test-results
          retention-days: 1

  # 24.11.2026 (thread «Tests schneller machen», found for the Wackel thread): part 1 ran into its 45 minutes every night, on the phone
  # and on the computer, and was cancelled before it wrote its list of red tests, so the night run could never become green.
  # Cause: Playwright 1.65 cuts the parts only by number of tests, one block after the other in the order of the files, and
  # «Ausprobieren» (tests/e2e/ausprobieren.spec.js: 85 tests, each taps 20 lines of What is new, 1 to 1.5 minutes each) lies in
  # one piece in part 1: about an hour of work. Now these tests are cut out of the 7 parts (E2E_SKIP_AUSPROBIEREN) and run as
  # their own 3 parts per project. No limit of a test was raised and no test was loosened: all 85 still tap their lines.
  ausprobieren:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        project: [phone, desktop]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the whole history: scripts/news.mjs numbers versions by the order of merges
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright test tests/e2e/ausprobieren.spec.js --project=${{ matrix.project }} --shard=${{ matrix.shard }}/3
        env:
          E2E_SKIP_GESAMTTEST: '1'
      - if: always()
        run: node scripts/test-summary.mjs pw-report.json "ausprobieren ${{ matrix.project }} ${{ matrix.shard }}" rot-ausprobieren-${{ matrix.project }}-${{ matrix.shard }}.txt wackel-ausprobieren-${{ matrix.project }}-${{ matrix.shard }}.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rot-ausprobieren-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            rot-ausprobieren-${{ matrix.project }}-${{ matrix.shard }}.txt
            wackel-ausprobieren-${{ matrix.project }}-${{ matrix.shard }}.txt
          retention-days: 2
          if-no-files-found: ignore
      - if: failure()
        run: for f in test-results/*/error-context.md; do echo "::group::$f"; head -c 20000 "$f"; echo "::endgroup::"; done
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: voll-ausprobieren-${{ matrix.project }}-${{ matrix.shard }}
          path: test-results
          retention-days: 1

  report:
    needs: [e2e-part, gesamttest, ausprobieren]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      LABEL: volle-pruefung
      SHA: ${{ github.sha }}
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7 # scripts/nacht-vergleich.mjs
      - name: Write the report
        run: |
          {
            echo "### Volle Prüfung $(date -u +'%Y-%m-%d %H:%M') UTC"
            echo
            echo "Version auf main: \`${SHA:0:8}\` · Anlass: ${{ github.event_name == 'schedule' && 'Nacht' || 'von Hand' }}"
            echo
            echo "- Browsertests: ${{ needs.e2e-part.result }}"
            echo "- Gesamttest: ${{ needs.gesamttest.result }}"
            echo "- Ausprobieren: ${{ needs.ausprobieren.result }}"
            echo
            echo "Ganzer Lauf: $RUN"
          } > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      # 21.11.2026 (Noah «d plus b»): the night run was red every night from 3 to 21 November. One old issue got a comment
      # per night, and a new red test hid between the old ones. Now every job leaves the names of its failed tests; this
      # step compares them with the night before. The issue gets a comment (a mail) only when something is NEW red.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: rot-*
          merge-multiple: true
          path: rot
      - name: Compare with the night before
        id: vergleich
        run: |
          mkdir -p vorher
          prev=''
          for id in $(gh run list --workflow volle-pruefung.yml --status completed --limit 6 --json databaseId --jq '.[].databaseId'); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            if gh run download "$id" -n rot-liste -D vorher 2>/dev/null; then prev="$id"; break; fi
          done
          prev_sha=''
          [ -n "$prev" ] && prev_sha=$(gh run view "$prev" --json headSha --jq .headSha || true)
          echo "prev_sha=$prev_sha" >> "$GITHUB_OUTPUT"
          # 32 jobs leave a list: 14 browser parts + 12 Gesamttest parts + 6 Ausprobieren parts
          node scripts/nacht-vergleich.mjs rot "${prev:+vorher/rot-liste.txt}" rot-liste.txt 32 > vergleich.md
          cat vergleich.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rot-liste
          path: rot-liste.txt
          retention-days: 7
          if-no-files-found: ignore
      # 21.11.2026 (Noah «4»): a test that is red once and green on the retry used to vanish and was started again. Every job
      # leaves the names of its flaky tests (wackel-*.txt, inside the rot-* artifacts); this step counts the nights per test
      # (scripts/wackel-liste.mjs). A test that wobbles on a SECOND night is a work order: repair the cause within a day.
      - name: Wobbly list
        id: wackel
        if: always()
        run: |
          mkdir -p wackel-vorher
          for id in $(gh run list --workflow volle-pruefung.yml --status completed --limit 6 --json databaseId --jq '.[].databaseId'); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            if gh run download "$id" -n wackel-liste -D wackel-vorher 2>/dev/null; then break; fi
          done
          before=-
          [ -f wackel-vorher/wackel-liste.json ] && before=wackel-vorher/wackel-liste.json
          node scripts/wackel-liste.mjs rot "$before" wackel-liste.json > wackel.md
          { echo '### Wackel-Tests'; echo; cat wackel.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wackel-liste
          path: wackel-liste.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Wobbly issue (a mail only when a test wobbles on a second night)
        if: always()
        env:
          WACKLER: ${{ steps.wackel.outputs.wackler }}
          NEU2: ${{ steps.wackel.outputs.neu2 }}
          WLABEL: wackel-test
        run: |
          [ -f wackel.md ] || exit 0
          gh label create "$WLABEL" --color FBCA04 --description 'Tests, die rot und beim zweiten Versuch grün waren: Ursache reparieren, nicht neu starten' 2>/dev/null || true
          num=$(gh issue list --label "$WLABEL" --state open --json number --jq '.[0].number // empty')
          if [ "${WACKLER:-0}" != "0" ]; then
            {
              echo 'Diese Tests waren an mindestens zwei Nächten rot und beim zweiten Versuch grün. Ein Wackler hat eine Ursache (Warten auf etwas Falsches, eine Uhr, die Reihenfolge). Claude sucht sie und repariert den Test oder die App innerhalb eines Tages mit einem kleinen PR. Neu starten ist keine Lösung.'
              echo
              cat wackel.md
              echo
              echo "Stand: Lauf ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            } > wackel-body.md
            if [ -n "$num" ]; then
              gh issue edit "$num" --body-file wackel-body.md
              [ "${NEU2:-0}" != "0" ] && gh issue comment "$num" --body-file wackel.md
            else
              gh issue create --title 'Wackel-Tests: Ursache reparieren' --label "$WLABEL" --body-file wackel-body.md
            fi
          elif [ -n "$num" ]; then
            gh issue close "$num" --comment "Keine Wackler mehr in der Liste.$(printf '\n\n')$(cat wackel.md)"
          fi
          true
      # Noah 04.11.2026 «Test-Plan 4»: a red night run says in one line what is red and which merged PRs came
      # since the last run, so the morning starts with the suspects and not with a search.
      # 21.11.2026: since the night before (not since the last GREEN run: that was 18 days back, «232 weitere»).
      - name: Name the suspects
        if: needs.e2e-part.result != 'success' || needs.gesamttest.result != 'success' || needs.ausprobieren.result != 'success'
        env:
          PREV_SHA: ${{ steps.vergleich.outputs.prev_sha }}
        run: |
          failed=$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --jq '[.jobs[] | select((.conclusion == "failure" or .conclusion == "cancelled") and .name != "report") | .name + (if .conclusion == "cancelled" then " (Zeitlimit)" else "" end)] | join(", ")' || true)
          good=$(gh run list --workflow volle-pruefung.yml --status success --limit 1 --json headSha --jq '.[0].headSha // empty' || true)
          from="${PREV_SHA:-$good}"
          suspects=''
          if [ -n "$from" ] && [ "$from" != "$SHA" ]; then
            suspects=$(gh api "repos/$GH_REPO/compare/$from...$SHA" --jq '[.commits[].commit.message | split("\n")[0] | select(test("\\(#[0-9]+\\)$"))] | if length > 12 then (.[0:12] | join("; ")) + "; und \(length - 12) weitere" else join("; ") end' || true)
          fi
          {
            cat vergleich.md
            echo
            echo "Rot: ${failed:-(Lauf ansehen)}."
            echo
            if [ -n "$suspects" ]; then
              echo "Verdächtig, seit der letzten Nacht auf main gemerged: $suspects"
            elif [ -z "$from" ]; then
              echo "Verdächtig: nicht bekannt (es gibt noch keinen früheren Lauf zum Vergleichen)."
            else
              echo "Seit dem letzten Lauf (\`${from:0:8}\`) ist nichts Neues auf main: vermutlich ein Wackler."
            fi
            echo
            cat report.md
          } > report-new.md
          mv report-new.md report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Open or update the issue
        if: needs.e2e-part.result != 'success' || needs.gesamttest.result != 'success' || needs.ausprobieren.result != 'success'
        env:
          NEU: ${{ steps.vergleich.outputs.neu }}
          ERSTER: ${{ steps.vergleich.outputs.erster }}
          UNVOLLSTAENDIG: ${{ steps.vergleich.outputs.unvollstaendig }}
        run: |
          gh label create "$LABEL" --color D93F0B --description 'Die volle Prüfung nach dem Online-Gehen hat einen Fehler gefunden' 2>/dev/null || true
          num=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            # a comment sends a mail: only when something is new red, at the first comparison, or when a job left no list
            if [ "${NEU:-0}" != "0" ] || [ "$ERSTER" = "yes" ] || [ "$UNVOLLSTAENDIG" = "yes" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              gh issue comment "$num" --body-file report.md
            else
              echo "Nothing new red since the night before: no new mail."
            fi
          else
            {
              echo 'Die volle Prüfung hat an der Version, die online ist, einen Fehler gefunden. Claude repariert ihn mit einem kleinen PR. Ist es dringend, sag «zurück».'
              echo
              cat report.md
            } > body.md
            gh issue create --title 'Volle Prüfung: ein Test ist rot' --label "$LABEL" --body-file body.md
          fi
      - name: Close the issue when all is fine again
        if: needs.e2e-part.result == 'success' && needs.gesamttest.result == 'success' && needs.ausprobieren.result == 'success'
        run: |
          for num in $(gh issue list --label "$LABEL" --state open --json number --jq '.[].number'); do
            gh issue close "$num" --comment "Alles wieder grün.$(printf '\n\n')$(cat report.md)"
          done

      # 24.11.2026 (Noah «a-c alle», c = Nachtlauf): the short morning message. One standing issue «Nacht-Meldung»: title and body
      # are overwritten every night (an edit sends no mail), so green and «did not run» no longer look the same. The coordinator
      # reads it in the morning round and tells Noah. The line comes from scripts/nacht-meldung.mjs.
      - name: Morning message
        if: always()
        env:
          E2E: ${{ needs.e2e-part.result == 'success' && needs.ausprobieren.result == 'success' && 'success' || 'failure' }} # browser parts and Ausprobieren together
          GESAMTTEST: ${{ needs.gesamttest.result }}
          ROT: ${{ steps.vergleich.outputs.rot }}
          NEU: ${{ steps.vergleich.outputs.neu }}
          ERSTER: ${{ steps.vergleich.outputs.erster }}
          UNVOLLSTAENDIG: ${{ steps.vergleich.outputs.unvollstaendig }}
          WACKLER: ${{ steps.wackel.outputs.wackler }}
          VERGLEICH_DATEI: vergleich.md
          ROT_LISTE_DATEI: rot-liste.txt
          MLABEL: nacht-meldung
        run: |
          DATUM=$(TZ=Europe/Zurich date +'%d.%m.')
          RUNDGANG=$(gh run list --workflow nacht.yml --status completed --limit 1 --json conclusion --jq '.[0].conclusion // empty' || true)
          at=$(gh run list --workflow nacht.yml --status completed --limit 1 --json updatedAt --jq '.[0].updatedAt // empty' || true)
          RUNDGANG_ALTER_H=''
          [ -n "$at" ] && RUNDGANG_ALTER_H=$(( ($(date -u +%s) - $(date -u -d "$at" +%s)) / 3600 ))
          export DATUM RUNDGANG RUNDGANG_ALTER_H
          title=$(node scripts/nacht-meldung.mjs titel)
          node scripts/nacht-meldung.mjs text > meldung.md
          { echo '### Morgenmeldung'; echo; cat meldung.md; } >> "$GITHUB_STEP_SUMMARY"
          gh label create "$MLABEL" --color 0E8A16 --description 'Stand der letzten Nacht, wird jede Nacht überschrieben (kein Kommentar, keine Mail)' 2>/dev/null || true
          num=$(gh issue list --label "$MLABEL" --state open --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue edit "$num" --title "$title" --body-file meldung.md
          else
            gh issue create --title "$title" --label "$MLABEL" --body-file meldung.md
          fi
          true
