# Builds the app and publishes it to GitHub Pages.
# Noah 27.10.2026 «1a 2a» (thread «Weg von gebaut zu online»): GitHub gives 20 test computers at once and
# the old check took 18 of them, so only one check ran at a time and merged PRs waited hours to go online.
# Now:
# - a pull request: build + unit tests, the phone browser tests (5 parts) and the Wächter on the computer
#   (tests/e2e/guard.spec.js, every main page at 1440 px). 8 instead of 18 computers.
# - main (after a merge): build + unit tests, then straight online (the «Schnellspur», about 5 minutes).
#   A running publish is never cancelled; merges that come meanwhile go online together right after.
#   Since the evening of 27.10.2026 this is one job («online»: build, unit tests, publish, Releases entry):
#   GitHub has no priority, so every extra job waited again behind all pull request tests.
# - the full browser tests on the computer and the Gesamttest run after going online and every night
#   (.github/workflows/volle-pruefung.yml); a red one opens an issue, Claude repairs, «zurück» stays possible.
# Noah 28.10.2026 «1a»: the phone browser tests of a pull request run only after his approval (a tap on
# «Freigeben», or «ok N»). Claude then puts the label «ok» on the PR; that starts «e2e (phone)», and Claude
# merges when it is green. Before the ok a PR runs only build + unit tests and the Wächter on the computer, so PRs that are still changing leave the test
# computers free. A push after the label runs everything again.
name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # the label «ok» starts its own run (only the phone tests), so it never cancels the running build check;
  # any other label lands in a group of its own and runs nothing
  group: pages-${{ github.ref }}${{ github.event.action == 'labeled' && format('-{0}', github.event.label.name) || '' }}
  # a new push to a pull request replaces its old check; on main a running publish always finishes
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The check «build» of a pull request (the branch rule asks for it).
  build:
    if: github.ref != 'refs/heads/main' && github.event.action != 'labeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the whole history: scripts/news.mjs numbers versions by the order of merges
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Phone browser tests in five parts at the same time (about 13 minutes). Only on pull requests with the
  # label «ok» (Noah's ok, see above): they ran here already before the merge, so main does not wait again.
  e2e-part:
    if: >-
      github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ok') &&
      (github.event.action != 'labeled' || github.event.label.name == 'ok')
    runs-on: ubuntu-latest
    # 45 since 22.10.2026: on slow runners the parts passed every test but hit 30 min (#238).
    timeout-minutes: 45
    # Noah 26.10.2026 «1a»: the official Playwright image already has Chromium and its system
    # packages. The tag must match @playwright/test in package.json (tests/ci-image.test.js).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the whole history: scripts/news.mjs numbers versions by the order of merges
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run e2e -- --project=phone --shard=${{ matrix.shard }}/5
        env:
          E2E_SKIP_GESAMTTEST: '1' # runs after going online (volle-pruefung.yml)
      # Failed and flaky (passed only on the retry) tests by name, in the summary of the run
      - if: always()
        run: node scripts/test-summary.mjs pw-report.json "phone part ${{ matrix.shard }}"
      # The page as the failing test saw it, readable in the log (the artifact can't be opened everywhere).
      - if: failure()
        run: for f in test-results/*/error-context.md; do echo "::group::$f"; head -c 20000 "$f"; echo "::endgroup::"; done
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-results-phone-${{ matrix.shard }}
          path: test-results
          retention-days: 1 # Noah 11.10.2026: 0 costs; the free 0.5 GB Actions storage filled up with 7-day test results

  # The branch rule asks for the checks «e2e (phone)» and «e2e (desktop)».
  # «e2e (phone)» is green only when all five phone parts passed (a skipped job would count as green).
  # Without the label it does not run: the PR waits for Noah's ok, and Claude merges only after this ran green.
  e2e-phone:
    name: e2e (phone)
    if: >-
      always() && github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ok') &&
      (github.event.action != 'labeled' || github.event.label.name == 'ok')
    needs: [e2e-part]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.e2e-part.result }}" = "success"

  # «e2e (desktop)»: the Wächter on the computer, every main page at 1440 px (sideways scrolling, broken
  # words, one page title). The other computer tests run after going online and every night.
  e2e-desktop:
    name: e2e (desktop)
    if: github.event_name == 'pull_request' && github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright test tests/e2e/guard.spec.js --project=desktop
      - if: always()
        run: node scripts/test-summary.mjs pw-report.json "desktop guard"
      - if: failure()
        run: for f in test-results/*/error-context.md; do echo "::group::$f"; head -c 20000 "$f"; echo "::endgroup::"; done
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-results-desktop-guard
          path: test-results
          retention-days: 1

  # Schnellspur: main goes online as soon as it is built and the unit tests passed, all in ONE job, so it
  # waits only once for a free GitHub computer (27.10.2026: the separate publish job waited 25 minutes more).
  # Noah 26.10.2026 «1a» and 27.10.2026 «5a»: right after going online GitHub writes its own entry under
  # Releases (github.com/noahdolmetsch-af/packgenerator/releases): the version that is online now and every
  # merged PR in it. Only GITHUB_TOKEN, no secret. If the entry fails, the app is online anyway.
  online:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the whole history: scripts/news.mjs numbers versions by the order of merges
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Releases entry
        continue-on-error: true
        run: |
          node scripts/release-notes.mjs > notes.md && cat notes.md >> "$GITHUB_STEP_SUMMARY"
          v="v$(node scripts/news.mjs --version)"
          if gh release view "$v" >/dev/null 2>&1; then
            gh release edit "$v" --notes-file notes.md
          else
            gh release create "$v" --target "$GITHUB_SHA" --title "Online: $v" --notes-file notes.md --latest
          fi
