# Builds the app and publishes it to GitHub Pages.
# Pull requests only build and test (a check that nothing is broken); main also deploys.
# v0.21.0 (decision 7a): the e2e job plays the whole trip loop in a browser (phone and desktop,
# English and German); main only deploys when it passes.
name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  # v0.30.0 (Noah 1a): phone and desktop run side by side, so a check takes about half as long.
  e2e-part:
    runs-on: ubuntu-latest
    # 30 like the Gesamttest: the phone run has 583 tests and stopped at 582 after 20 min (18.10.2026)
    # Noah 19.10.2026 «können wir diese tests in zukunft kürzen?»: each project runs in three parts at
    # the same time (about 10 instead of 30 minutes). Every test still runs; GitHub is free for public repos.
    # 45 since 22.10.2026: on slow runners three parts passed every test but hit 30 min (#238).
    timeout-minutes: 45
    # Noah 26.10.2026 «1a»: the official Playwright image already has Chromium and its system
    # packages. Installing them on a plain runner took up to 13 minutes (slow Ubuntu mirror), about
    # half of every check. The tag must match @playwright/test in package.json (tests/ci-image.test.js).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        project: [phone, desktop]
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run e2e -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}/5
        env:
          E2E_SKIP_GESAMTTEST: '1' # runs in its own job below
      # The page as the failing test saw it, readable in the log (the artifact can't be opened everywhere).
      - if: failure()
        run: for f in test-results/*/error-context.md; do echo "::group::$f"; head -c 20000 "$f"; echo "::endgroup::"; done
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-results-${{ matrix.project }}-${{ matrix.shard }}
          path: test-results
          retention-days: 1 # Noah 11.10.2026: 0 costs; the free 0.5 GB Actions storage filled up with 7-day test results

  # The branch rule asks for the checks «e2e (desktop)» and «e2e (phone)»: one summary job per
  # device that is green only when all three parts passed (a skipped job would count as green).
  e2e:
    if: always()
    needs: [e2e-part]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [phone, desktop]
    steps:
      - run: test "${{ needs.e2e-part.result }}" = "success"

  # v0.45.1 (Noah: browser tests stay in CI): the Gesamttest with the big fictional data set
  # (tests/e2e/gesamttest, 700 items): every page at 390/320/1366 px in German and English, the
  # scenarios S1-S8 and the same counts everywhere. Split in two per project so it stays short.
  gesamttest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Noah 26.10.2026 «1a»: the official Playwright image already has Chromium and its system
    # packages. Installing them on a plain runner took up to 13 minutes (slow Ubuntu mirror), about
    # half of every check. The tag must match @playwright/test in package.json (tests/ci-image.test.js).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        project: [phone, desktop]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright test tests/e2e/gesamttest --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2
      - if: failure()
        run: for f in test-results/*/error-context.md; do echo "::group::$f"; head -c 20000 "$f"; echo "::endgroup::"; done
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: gesamttest-results-${{ matrix.project }}-${{ matrix.shard }}
          path: test-results
          retention-days: 1 # Noah 11.10.2026: 0 costs; the free 0.5 GB Actions storage filled up with 7-day test results

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build, e2e, gesamttest]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
