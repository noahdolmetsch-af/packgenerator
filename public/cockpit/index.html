<!doctype html>
<!--
  Bike Cockpit prototype (v4) from the "Bike Cockpit" Claude project, hosted as an offline web app
  until the real Pack Generator app replaces it. Changes against the original file:
  1. Proper document head (charset, viewport, manifest, icons).
  2. Save label reads "Saved on device · Backup" and opens the backup dialog (see end of file).
  3. Backup dialog: export / import all prototype data as a JSON file.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<script>
// A backup import is parked in sessionStorage and written here, before the app reads its data,
// so the old page cannot overwrite it while unloading.
try {
  var pending = sessionStorage.getItem('bikeCockpit.pendingImport');
  if (pending) { localStorage.setItem('bikeCockpit.v2', pending); sessionStorage.removeItem('bikeCockpit.pendingImport'); }
} catch (err) {}
// Offline support: the Pack Generator service worker (one level up) also caches this page.
if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(function () {});
</script>
<title>Bike Cockpit</title>
<meta name="theme-color" content="#0F2E27">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sofia+Sans+Extra+Condensed:wght@600;700;800;900&family=Fira+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:light;
  --ground:#D9DED4;--paper:#F5F6F1;--paper-2:#E6EBE3;--paper-3:rgba(245,246,241,.94);--paper-45:rgba(245,246,241,.45);
  --ink:#0F2E27;--ink-2:#3B4F46;--ink-3:#6F8378;--line:#A9B4A8;--line-2:#C9D1C6;--chip:#DDE3DA;--track:#D5DCD2;
  --hi:#FF5B14;--hi-2:#FF7A3D;--hi-soft:#FFE9DC;--hi-softer:#FFF1E8;--hi-tint:#FBE9DF;--hi-ring:rgba(255,91,20,.35);--hi-wash:rgba(255,91,20,.10);
  --red:#B42318;--red-soft:#FBE4E1;--amber:#B7791F;--warn-ink:#9A4A06;--edit-ink:#8A3A08;
  --over:#CFE0D6;--drag:#E8EFE9;--bike:#97A69B;--stage-edit:#FBF6EF;--slot:rgba(232,239,233,.92);
  --dark:#0F2E27;--dark-2:#1D4A3F;--dark-line:#2E4C44;--dark-row:#24433B;--on-dark:#F5F6F1;--on-dark-2:#C4D0C8;
  --go:#7FD3A8;--knob-off:#8C9A90;--topo:#0F2E27;--shadow:rgba(15,46,39,.2);--scrim:rgba(15,46,39,.45);
  --wash-ink:rgba(15,46,39,.06);--wash-ink-2:rgba(15,46,39,.12);
  --c-elec:#C99A06;--c-onbike:#2E6DB4;--c-rain:#3BA3B8;--c-offbike:#8C63C0;--c-shoes:#8A5A35;--c-tools:#5F6B73;--c-food:#E0782A;--c-sleep:#2F8F5B;--c-hyg:#D0507A;--c-docs:#8A8F2E;--c-opt:#FF5B14;
  --gut:32px;--tab-h:0px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"Fira Sans","Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.4;overflow-x:hidden}
.d{font-family:"Sofia Sans Extra Condensed","Oswald","Arial Narrow",sans-serif}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:-1px}
a{color:var(--ink);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px;text-decoration-color:var(--hi)}
button{font-family:inherit;cursor:pointer;color:var(--ink);font-size:inherit}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.scroll{scrollbar-width:thin;scrollbar-color:var(--line) transparent;overflow-y:auto;overscroll-behavior:contain}
svg{flex:none}
.topo{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:0;stroke:var(--topo);stroke-opacity:.075;stroke-width:1.2;fill:none}
#app{position:relative;z-index:1}
.wrap{max-width:1440px;margin:0 auto;padding-left:var(--gut);padding-right:var(--gut)}

/* header */
.top{border-bottom:1px solid var(--line)}
.top-in{min-height:50px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 28px}
.brand{display:flex;align-items:center;gap:9px}
.brand svg{stroke:var(--ink)}
.brand .d{font-weight:900;font-size:24px;letter-spacing:.08em;line-height:1}
.mainnav{display:flex;flex-wrap:wrap;gap:22px;flex:1 1 auto;font-size:14px;font-weight:500}
.mainnav a{padding:4px 0;color:var(--ink-2)}
.mainnav a[aria-current]{border-bottom:3px solid var(--hi);font-weight:600;color:var(--ink)}
.btn-hi{padding:7px 16px;border:0;border-radius:2px;background:var(--hi);color:var(--ink);font-size:14px;font-weight:700;letter-spacing:.02em;transition:background .12s}
.btn-hi:hover{background:var(--hi-2)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--on-dark);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px}
.save{font-size:12px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.save::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.save[data-state="saved"]::before{background:var(--c-sleep)}
.save[data-state="saving"]::before,.save[data-state="pending"]::before{background:var(--amber)}
.save[data-state="error"]::before{background:var(--red)}
.save[data-state="offline"]::before{background:var(--line)}
.save:empty{display:none}

/* hero */
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 40px}
.hero-l{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 22px;min-width:0}
.big303{font-size:156px;font-weight:900;line-height:.76;letter-spacing:-.035em;position:relative;padding-right:4px}
.sq{position:absolute;right:-14px;bottom:6px;width:14px;height:14px;background:var(--hi)}
.hero-meta{display:flex;flex-direction:column;gap:6px;padding-bottom:2px;min-width:0}
.tags{margin:0;display:flex;flex-wrap:wrap;gap:6px;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.tag{padding:3px 8px;border:1px solid var(--ink);white-space:nowrap}
.tag-hi{background:var(--hi);border-color:var(--hi)}
.oct{font-size:76px;font-weight:800;line-height:.82;text-transform:uppercase;letter-spacing:.01em}
.sub{margin:0;font-size:15px;color:var(--ink-2);max-width:520px}
.sub b{font-weight:600;color:var(--ink)}
.hero-r{display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right;margin-left:auto}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.total{font-size:88px;font-weight:900;line-height:.8}
.total small{font-size:34px;font-weight:800;margin-left:4px}
.subt{font-size:13px;color:var(--ink-2)}

/* trip settings row */
.settings{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:7px 0;border-top:2px solid var(--ink);border-bottom:1px solid var(--line)}
.lbl{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
.stepper{display:flex;align-items:center;border:1px solid var(--ink);border-radius:2px}
.stepper button{width:28px;height:28px;border:0;background:transparent;display:flex;align-items:center;justify-content:center}
.stepper button:hover{background:var(--paper-2)}
.stepper .val{font-size:14px;font-weight:600;min-width:74px;text-align:center}
.note{font-size:12px;color:var(--ink-2)}
.switch{display:flex;align-items:center;gap:8px;padding:4px 2px;border:0;background:transparent;font-size:14px;font-weight:600}
.track{width:32px;height:18px;border-radius:9px;background:var(--knob-off);position:relative;display:inline-block;transition:background .15s}
.track::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--paper);transition:left .15s}
[aria-pressed="true"] .track{background:var(--ink)}
[aria-pressed="true"] .track::after{left:16px}
.sets{display:flex;flex-wrap:wrap;gap:4px}
.setb{display:flex;align-items:center;gap:6px;border-radius:2px;border:1px solid var(--ink);background:transparent;font-size:13px;font-weight:600;padding:4px 7px;transition:background .12s}
.setb:hover:not(:disabled){background:var(--paper-2)}
.setb[aria-pressed="true"]{background:var(--ink);color:var(--on-dark)}
.setb[aria-pressed="true"]:hover{background:var(--dark-2)}
.setb.base{background:var(--chip);color:var(--ink);border-color:var(--line)}
.setb .meta{font-weight:400;font-size:12px;opacity:.85}
.seg{display:flex;border:1px solid var(--ink);border-radius:2px;overflow:hidden}
.seg button{border:0;padding:5px 14px;font-size:13px;font-weight:600;background:transparent}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-dark)}
.seg button[aria-pressed="false"]:hover{background:var(--paper-2)}
.grow{flex:1 1 0}
.linkbtn{border:0;background:transparent;padding:4px 6px;font-size:13px;font-weight:600;text-decoration:underline;text-decoration-color:var(--hi);text-underline-offset:3px;border-radius:2px}
.linkbtn:hover{background:var(--paper-2)}
.confirm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:600;padding:3px 4px 3px 10px;background:var(--hi-soft);border-left:3px solid var(--hi)}
.btn-ink{border:0;border-radius:2px;background:var(--ink);color:var(--on-dark);font-size:13px;font-weight:600;padding:5px 12px}
.btn-ink:hover{background:var(--dark-2)}
.btn-ghost{border:1px solid var(--ink);border-radius:2px;background:transparent;font-size:13px;font-weight:600;padding:4px 12px}
.btn-ghost:hover{background:var(--paper-2)}

/* chapters */
.chapters{display:flex;flex-wrap:wrap;gap:8px}
.chap{flex:1 1 0;min-width:220px;display:flex;align-items:center;gap:14px;padding:10px 16px 9px;border:0;border-top:4px solid var(--ink);border-radius:0;background:var(--paper-45);text-align:left;transition:background .15s}
.chap:hover{background:var(--paper)}
.chap[aria-current="step"]{flex:2 1 0;border-top-color:var(--hi);background:var(--paper)}
.chap .n{font-size:46px;font-weight:900;line-height:.8}
.chap[aria-current="step"] .n{color:var(--hi)}
.chap .t{display:flex;flex-direction:column;gap:1px;flex:1 1 auto;min-width:0}
.chap .nm{font-size:22px;font-weight:800;line-height:1;text-transform:uppercase;letter-spacing:.04em}
.chap[aria-current="step"] .nm{font-size:26px}
.chap .sm{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chap svg{stroke:var(--ink);transition:transform .15s ease}
.chap:hover svg{transform:translateX(3px)}

/* panels */
.panel{background:var(--paper);border:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.ph{padding:12px 16px 9px;display:flex;justify-content:space-between;align-items:flex-end;gap:8px;border-bottom:1px solid var(--line-2)}
.h2{margin:0;font-size:28px;font-weight:800;line-height:.9;text-transform:uppercase}
.cnt{color:var(--ink-2);font-size:12px}
.grp{display:flex;flex-direction:column;margin-bottom:3px}
.grp.opt{background:var(--hi-tint);padding:2px 2px 6px}
.grp-h{display:flex;align-items:center;gap:8px;padding:7px 8px;border:0;background:transparent;text-align:left;width:100%;border-radius:2px}
.grp-h:hover{background:var(--paper-2)}
.grp-h .gn{flex:1 1 auto;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.grp-h .gc{font-size:12px;color:var(--ink-2)}
.grp-h svg{stroke:var(--ink-2)}
.sw{width:10px;height:10px;flex:none;display:inline-block}
.sw.s8{width:8px;height:8px}
.row{display:flex;align-items:center;gap:8px;padding:2px 4px 2px 8px;border:1px solid transparent;transition:background .1s}
.row:hover{background:var(--paper-2)}
.row[draggable="true"]{cursor:grab;user-select:none}
.row[draggable="true"]:active{cursor:grabbing}
.row.sel{background:var(--hi-soft);border-color:var(--hi)}
.row.dragsrc{opacity:.45}
.pick{flex:1 1 auto;min-width:0;display:flex;align-items:baseline;gap:8px;padding:3px 0;border:0;background:transparent;text-align:left;font-size:14px}
.pick .nm{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.pick small{font-size:11px;color:var(--ink-2)}
.amt{font-size:12px;color:var(--ink-2);white-space:nowrap}
.add{flex:none;width:26px;height:26px;border-radius:2px;border:1px solid var(--ink);background:transparent;display:flex;align-items:center;justify-content:center;transition:background .1s,color .1s}
.add:hover{background:var(--ink);color:var(--on-dark)}
.tgt .add{border-color:var(--hi);background:var(--hi-softer)}
.tgt .row:hover .add,.tgt .add:hover{background:var(--hi);color:var(--ink);border-color:var(--hi)}
.tgt .row:hover{background:var(--hi-softer)}
.empty{color:var(--ink-2);font-size:14px;padding:12px 8px}
.empty b{color:var(--ink)}

.prow{display:flex;align-items:center;gap:8px;padding:1px 0 1px 17px;font-size:14px;border-radius:2px}
.prow:hover{background:var(--paper-2)}
.prow[draggable="true"]{cursor:grab;user-select:none}
.prow .nm{flex:1 1 auto;min-width:0}
.ktag{font-size:11px;color:var(--ink-2);padding:0 6px;border:1px solid var(--line);white-space:nowrap}
.prow .amt{min-width:44px;text-align:right}
.x{width:26px;height:26px;border:0;background:transparent;color:var(--ink-2);display:flex;align-items:center;justify-content:center;border-radius:2px;flex:none}
.x:hover{background:var(--chip);color:var(--red)}
.gl{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);padding:8px 0 2px}

/* bike column */
.bikecol{display:flex;flex-direction:column;gap:8px;min-width:0}
.hint{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;min-height:34px}
.hint .msg{font-size:14px}
.hint .msg.strong{font-weight:600}
.hint .msg.edit{color:var(--edit-ink);font-weight:600}
.banner{flex:1 1 auto;display:flex;align-items:center;gap:10px;min-height:34px;padding:3px 4px 3px 12px;background:var(--hi);color:var(--ink);font-size:14px}
.banner .bt{flex:1 1 auto;min-width:0}
.banner b{font-weight:800}
.banner .dot{width:8px;height:8px;border-radius:50%;background:var(--ink);flex:none;animation:pulse 1.4s ease-in-out infinite}
.banner.selb{background:var(--hi-soft);border-left:4px solid var(--hi)}
.banner .done{border:0;border-radius:2px;background:var(--ink);color:var(--on-dark);font-weight:700;font-size:13px;padding:5px 14px}
.banner .done:hover{background:var(--dark-2)}
.banner.selb .done{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.editbtn{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:2px;font-size:13px;font-weight:600;border:1px solid var(--ink);background:transparent}
.editbtn:hover{background:var(--paper-2)}
.editbtn[aria-pressed="true"]{background:var(--hi-soft);border-color:var(--hi)}
.stage{background:var(--paper);border:1px solid var(--line);padding:6px 10px;display:flex;justify-content:center;align-items:center;container-type:size;min-height:0}
.stage.edit{background:var(--stage-edit)}
.bike{position:relative;width:min(100cqw,100cqh * 720 / 420);aspect-ratio:720/420}
.bike-svg{position:absolute;left:0;top:0;width:100%;height:100%;stroke:var(--bike);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;fill:none}
.bike-svg .ground{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:2 6}
.bike-svg .hub{fill:var(--bike)}
.mount{position:absolute;height:18px;display:flex;align-items:center;gap:4px;padding:0 6px;background:var(--chip);font-size:10px;font-weight:600;white-space:nowrap;pointer-events:none}
.mount::before{content:"";width:5px;height:5px;background:var(--ink)}
.zone{position:absolute;border-radius:3px;border:1.5px dashed var(--ink-3);background:var(--paper-3);padding:2px 6px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;text-align:left;overflow:hidden;transition:box-shadow .12s ease,background .12s ease,transform .12s ease}
.zone:hover{box-shadow:0 0 0 3px var(--hi-ring)}
.zone .zt{font-weight:700;font-size:12px;line-height:1.1;white-space:nowrap}
.zone .zm{font-size:10px;line-height:1.2;white-space:nowrap;color:var(--ink-2)}
.zone.open{border:2px solid var(--hi);background:var(--hi-softer)}
.zone.full{border:2px solid var(--red);background:var(--red-soft)}
.zone.target{border:2px solid var(--hi);background:var(--hi);box-shadow:0 0 0 4px var(--hi-ring)}
.zone.target .zm{color:var(--ink)}
.dragging .zone:not(.slot),.selmode .zone:not(.slot){border:2px dashed var(--ink);background:var(--drag)}
.zone.over,.dragging .zone.over{border:2px solid var(--ink);background:var(--over);box-shadow:0 6px 18px var(--shadow);transform:scale(1.04)}
.zone.ed{border:1.5px solid var(--ink-3)}
.zone.edsel{border:2px solid var(--hi);background:var(--hi-soft)}
.zone.slot{border:1.5px dashed var(--ink-3);background:var(--slot)}
.zone.slot.edsel{border:2px solid var(--hi);background:var(--hi-soft)}
.fill{display:block;width:100%;height:3px;margin-top:2px;background:var(--track);overflow:hidden}
.fill>span{display:block;height:100%;background:var(--ink)}
.fill>span.amber{background:var(--amber)}
.fill>span.red{background:var(--red)}
.flash{animation:flash .6s ease}
@keyframes flash{0%{transform:scale(1)}35%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.profile{background:var(--paper);border:1px solid var(--line);padding:8px 12px 6px;display:flex;flex-direction:column;gap:4px}
.profile .pt{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.profile .dir{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.profile .dir svg{stroke:var(--ink-2)}
.pwrap{position:relative}
.psvg{position:absolute;left:0;top:0;width:100%;height:50px;pointer-events:none;fill:none}
.psvg .base{stroke:var(--ink);stroke-opacity:.35;stroke-width:1}
.psvg .area{fill:var(--ink);fill-opacity:.13;stroke:none}
.psvg .cap{stroke:var(--red);stroke-width:1.5;stroke-dasharray:5 5}
.psvg .ridge{stroke:var(--hi);stroke-width:2.5}
.pcols{position:relative;display:flex}
.pcol{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;padding:52px 2px 3px;border:0;border-bottom:3px solid transparent;background:transparent;overflow:hidden;transition:background .12s}
.pcol:hover{background:var(--wash-ink)}
.pcol .pn{max-width:100%;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.pcol .pa{font-size:13px;font-weight:700;white-space:nowrap}
.pcol.open{border-bottom-color:var(--hi);background:var(--hi-wash)}
.pcol.full{border-bottom-color:var(--red)}
.pcol.full .pa{color:var(--red)}
.pcol.target{border-bottom-color:var(--hi);background:var(--hi-soft)}
.dragging .pcol,.selmode .pcol{background:var(--wash-ink)}
.pcol.over,.dragging .pcol.over{background:var(--wash-ink-2);border-bottom-color:var(--ink)}
.pdot{position:absolute;width:8px;height:8px;margin:-5px 0 0 -5px;border:2px solid var(--paper);border-radius:50%;background:var(--ink);pointer-events:none;box-sizing:content-box}
.pdot.amber{background:var(--amber)}.pdot.red{background:var(--red)}
.legend{display:flex;flex-wrap:wrap;gap:3px 12px}
.legend span{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-2)}
.opts{background:var(--paper);border:1px solid var(--line);padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.opts .oh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.opts h3{margin:0;font-size:22px;font-weight:800;text-transform:uppercase}
.optl{display:flex;flex-wrap:wrap;gap:8px}
.optb{display:flex;flex-direction:column;align-items:flex-start;padding:7px 12px;border-radius:2px;border:2px solid var(--line);background:var(--paper);text-align:left}
.optb:hover{border-color:var(--ink)}
.optb[aria-pressed="true"]{border-color:var(--hi);background:var(--hi-softer)}
.optb .on{font-weight:600;font-size:14px}.optb .oc{font-size:12px;color:var(--ink-2)}

/* open bag */
.bag{border-top:4px solid var(--hi)}
.bag.over-drop{box-shadow:0 0 0 3px var(--ink) inset}
.bh{padding:12px 18px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line-2)}
.bh .row1{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.bh h2{margin:0;min-width:0;font-size:38px;font-weight:900;line-height:.85;text-transform:uppercase}
.bh .big{font-size:30px;font-weight:800;line-height:.85;white-space:nowrap}
.bh .big.red{color:var(--red)}
.bh .row2{display:flex;flex-wrap:wrap;justify-content:space-between;gap:0 8px;font-size:13px;color:var(--ink-2)}
.bar{height:6px;background:var(--track);overflow:hidden}
.bar>div{height:100%;background:var(--ink);transition:width .25s ease}
.bar>div.amber{background:var(--amber)}.bar>div.red{background:var(--red)}.bar>div.muted{background:var(--ink-3)}
.warnbox{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:13px;font-weight:600;color:var(--red);padding:8px 10px;background:var(--red-soft);border-left:3px solid var(--red)}
.fixbtn{border:0;border-radius:2px;background:var(--ink);color:var(--on-dark);font-size:13px;font-weight:700;padding:5px 10px;display:inline-flex;align-items:center;gap:6px}
.fixbtn:hover{background:var(--dark-2)}
.bb{padding:4px 18px 14px;display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
.tgtnote{white-space:nowrap;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);background:var(--hi);padding:2px 8px;align-self:flex-start}

/* layouts: desktop */
.L-desk{height:100vh;min-height:760px;display:flex;flex-direction:column}
.L-desk main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:12px;padding-top:12px;padding-bottom:16px;width:100%}
.L-desk .content{flex:1 1 auto;min-height:0}
.pack{display:grid;gap:18px;height:100%}
.L-desk .pack{grid-template-columns:300px minmax(0,1fr) 330px}
.L-desk .tray,.L-desk .bag{height:100%;min-height:0}
.L-desk .tray .scroll,.L-desk .bag .scroll{flex:1 1 auto;min-height:0}
.L-desk .stage{flex:1 1 auto}
.tray .scroll{padding:6px 8px 10px}
.tray.tgtmode{border-top:4px solid var(--hi)}

/* tablet */
.L-tablet{--gut:24px}
.L-tablet main{display:flex;flex-direction:column;gap:12px;padding-top:12px;padding-bottom:28px}
.L-tablet .big303{font-size:120px}
.L-tablet .oct{font-size:58px}
.L-tablet .total{font-size:70px}
.L-tablet .chap{min-width:0}
.L-tablet .top-in{gap:8px 18px}
.L-tablet .mainnav{gap:16px}
.L-tablet .chap .sm{font-size:12px}
.L-tablet .pack{grid-template-columns:minmax(0,1fr) 300px;grid-template-areas:"bike bag" "tray tray";height:auto}
.L-tablet .bikecol{grid-area:bike}
.L-tablet .bag{grid-area:bag;contain:size;min-height:440px;height:100%}
.L-tablet .bag .scroll{flex:1 1 auto;min-height:0}
.L-tablet .tray{grid-area:tray}
.L-tablet .tray .scroll{overflow:visible;columns:2 300px;column-gap:18px}
.L-tablet .tray .grp{break-inside:avoid}
.L-tablet .stage{aspect-ratio:720/420;height:auto;width:100%}

/* wear */
.wear{display:flex;flex-wrap:wrap;gap:18px;align-items:stretch;height:100%}
.wear .panel{max-height:100%}
.onme{flex:2 1 460px}
.onme .scroll{flex:1 1 auto;min-height:0;padding:4px 20px 14px;columns:2 240px;column-gap:28px}
.onme .g{break-inside:avoid;display:flex;flex-direction:column}
.onme.over-drop{border-color:var(--ink);box-shadow:0 0 0 3px var(--ink) inset}
.mnt{flex:1 1 280px}
.mnt .scroll{flex:1 1 auto;min-height:0;padding:4px 20px 14px}
.wph{padding:14px 20px 10px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:1px solid var(--line-2)}
.wph h2{margin:0;font-size:36px;font-weight:800;line-height:.9;text-transform:uppercase}
.wph .cnt{font-size:14px}
.fixed{display:flex;flex-wrap:wrap;gap:6px}
.fixed span{font-size:12px;padding:2px 8px;border:1px solid var(--line)}
.h3s{margin:18px 0 6px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.layer{flex:1 1 320px;background:var(--dark);color:var(--on-dark);border:0}
.layer .wph{flex-direction:column;align-items:flex-start;gap:2px;border-bottom-color:var(--dark-line)}
.layer .wph span{font-size:13px;color:var(--on-dark-2)}
.layer .scroll{flex:1 1 auto;min-height:0;padding:6px 12px 14px;scrollbar-color:var(--dark-line) transparent}
.lrow{display:flex;align-items:center;gap:8px;padding:5px 6px;border-bottom:1px solid var(--dark-row)}
.lrow[draggable="true"]{cursor:grab}
.lrow .nm{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;line-height:1.2;font-size:14px}
.lrow .nm small{font-size:11px;color:var(--on-dark-2)}
.wearb{flex:none;padding:4px 9px;border:1px solid var(--on-dark);border-radius:2px;background:transparent;color:var(--on-dark);font-size:12px;font-weight:600}
.wearb:hover{background:var(--on-dark);color:var(--ink)}
.addhi{flex:none;width:28px;height:26px;border:0;border-radius:2px;background:var(--hi);color:var(--ink);display:flex;align-items:center;justify-content:center}
.addhi:hover{background:var(--hi-2)}
.layer .empty{color:var(--on-dark-2)}

/* check */
.check{display:flex;flex-wrap:wrap;gap:18px;align-items:stretch}
.ready{flex:3 1 640px;min-width:0;background:var(--paper);border:1px solid var(--line);padding:18px 22px;display:flex;flex-direction:column;gap:14px}
.ready .rh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.ready h2{margin:0;font-size:44px;font-weight:900;line-height:.85;text-transform:uppercase}
.ready .rh span{font-size:14px;color:var(--ink-2)}
.solid{padding:8px 16px;border-radius:2px;border:0;background:var(--ink);color:var(--on-dark);font-size:14px;font-weight:600}
.solid:hover{background:var(--dark-2)}
.rgroups{display:flex;flex-wrap:wrap;gap:18px 28px}
.rg{flex:1 1 240px;min-width:0;display:flex;flex-direction:column;gap:2px}
.rg .rgh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-bottom:4px;border-bottom:2px solid var(--ink)}
.rg h3{margin:0;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.citem{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-2)}
.citem input{width:19px;height:19px;accent-color:var(--ink);flex:none;margin:0}
.citem label{flex:1 1 auto;min-width:0;font-size:14px;color:var(--ink)}
.citem.muted label{color:var(--ink-2)}
.citem.warn label{color:var(--warn-ink)}
.auto{font-size:11px;font-weight:700;padding:1px 7px;background:var(--chip);letter-spacing:.06em}
.status{flex:1 1 300px;min-width:0;background:var(--dark);color:var(--on-dark);padding:18px 22px;display:flex;flex-direction:column;gap:14px}
.status .lbl{color:var(--on-dark-2);letter-spacing:.16em}
.status .score{font-size:132px;font-weight:900;line-height:.78}
.status .score i{font-style:normal;color:var(--hi)}
.status .w{font-size:13px;padding:10px 12px;background:var(--dark-row);border-top:2px solid var(--hi)}
.gobtn{padding:13px 22px;border-radius:2px;border:0;font-size:17px;font-weight:700;background:var(--hi);color:var(--ink);display:flex;align-items:center;justify-content:space-between;gap:12px;transition:filter .12s}
.gobtn:hover{filter:brightness(1.07)}
.gobtn.ok{background:var(--go)}

/* dock: toast + phone banner */
.dock{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:calc(100% - 32px);pointer-events:none}
.dock>*{pointer-events:auto}
.toast{display:flex;align-items:center;gap:12px;padding:8px 8px 8px 14px;background:var(--ink);color:var(--on-dark);font-size:14px;box-shadow:0 8px 24px var(--shadow);border-left:4px solid var(--hi);max-width:100%}
.toast.anim{animation:rise .18s ease}
.toast .tt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast button{border:0;border-radius:2px;background:transparent;color:var(--hi);font-weight:700;font-size:14px;padding:6px 10px;text-decoration:underline;text-underline-offset:3px}
.toast button:hover{background:var(--dark-2)}
@keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

/* phone */
.L-phone{--gut:16px;--tab-h:64px;padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 8px)}
.L-phone.has-banner{padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 150px)}
.phead{display:flex;align-items:center;gap:10px;padding:10px var(--gut) 8px;border-bottom:2px solid var(--ink)}
.ph303{font-size:64px;font-weight:900;line-height:.76;letter-spacing:-.035em;position:relative;padding-right:2px}
.ph303 .sq{width:8px;height:8px;right:-9px;bottom:3px}
.phmid{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1 1 auto;padding-left:6px}
.phmid .po{font-size:24px;font-weight:800;line-height:.85;text-transform:uppercase}
.phmid .tags{font-size:10px;letter-spacing:.1em}
.phmid .tag{padding:1px 5px}
.phtot{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.phtot .d{font-size:40px;font-weight:900;line-height:.8}
.phtot small{font-size:18px;font-weight:800;margin-left:2px}
.phtot .save{font-size:11px}
.iconbtn{width:44px;height:44px;flex:none;border:1px solid var(--ink);border-radius:2px;background:transparent;display:flex;align-items:center;justify-content:center}
.iconbtn:hover{background:var(--paper-2)}
.tripline{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:6px var(--gut);border:0;border-bottom:1px solid var(--line);background:var(--paper-45);font-size:13px;text-align:left}
.tripline .tl{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tripline b{font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:11px;margin-right:6px}
.tripline svg{stroke:var(--ink)}
.L-phone main{padding:12px var(--gut) 0;display:flex;flex-direction:column;gap:12px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{flex:1 1 0;min-width:0;min-height:var(--tab-h);display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 4px;border:0;border-top:4px solid transparent;background:transparent;text-align:left}
.tab[aria-current="step"]{border-top-color:var(--hi);background:var(--hi-softer)}
.tab .n{font-size:30px;font-weight:900;line-height:.8;color:var(--ink-3)}
.tab[aria-current="step"] .n{color:var(--hi)}
.tab .t{display:flex;flex-direction:column;min-width:0}
.tab .nm{font-size:18px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;line-height:1}
.tab .sm{font-size:11px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chipsw{position:sticky;top:0;z-index:5;margin:0 calc(-1 * var(--gut));padding:8px var(--gut);background:var(--ground);border-bottom:1px solid var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;scroll-snap-align:start;min-width:112px;max-width:150px;min-height:60px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;padding:6px 10px;border:1.5px dashed var(--ink-3);border-radius:3px;background:var(--paper);text-align:left;transition:background .12s,border-color .12s}
.chip .cn{font-weight:700;font-size:14px;line-height:1.1;white-space:nowrap}
.chip .cm{font-size:11px;color:var(--ink-2);white-space:nowrap}
.chip.open{border:2px solid var(--hi);background:var(--hi-softer)}
.chip.full{border:2px solid var(--red);background:var(--red-soft)}
.chip.target{border:2px solid var(--hi);background:var(--hi)}
.chip.target .cm{color:var(--ink)}
.chip.ed{border:1.5px solid var(--ink);justify-content:center;align-items:center;gap:6px;flex-direction:row;min-width:96px;font-weight:600;font-size:13px}
.chip.ed[aria-pressed="true"]{background:var(--hi-soft);border-color:var(--hi)}
.L-phone .row{min-height:52px;padding:0 0 0 10px;border-bottom:1px solid var(--line-2)}
.L-phone .pick{min-height:50px;padding:6px 0;font-size:15px;align-items:center}
.L-phone .add{width:48px;height:48px;border-radius:2px}
.L-phone .grp-h{min-height:48px;padding:8px 10px}
.L-phone .grp-h .gn{font-size:12px}
.L-phone .tray{border-top:2px solid var(--ink)}
.L-phone .tray .scroll{overflow:visible;padding:4px 4px 10px}
.L-phone .tray.tgtmode{border-top:4px solid var(--hi)}
.L-phone .prow{min-height:44px;padding-left:12px;font-size:15px}
.L-phone .x{width:44px;height:44px}
.L-phone .gl{padding:10px 0 2px}
.pob{border-top:4px solid var(--hi)}
.pobh{width:100%;min-height:56px;display:flex;align-items:center;gap:10px;padding:8px 12px;border:0;background:transparent;text-align:left}
.pobh .pn{display:flex;flex-direction:column;flex:1 1 auto;min-width:0}
.pobh .pn b{font-size:22px;font-weight:900;text-transform:uppercase;line-height:.95}
.pobh .pn span{font-size:12px;color:var(--ink-2)}
.pobh .bar{width:64px;flex:none}
.pobh svg{stroke:var(--ink);transition:transform .15s}
.pobh[aria-expanded="true"] svg{transform:rotate(180deg)}
.pob .bb{padding:0 12px 12px}
.pob .warnbox{margin:0 12px 10px}
.setlist{display:flex;flex-direction:column}
.setpos{padding:10px 12px;border-bottom:1px solid var(--line-2);display:flex;flex-direction:column;gap:8px}
.setpos .spn{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.L-phone .optb{min-height:48px;justify-content:center}
.L-phone .wear{flex-direction:column;flex-wrap:nowrap;height:auto}
.L-phone .wear .panel{flex:none;max-height:none}
.L-phone .onme .scroll,.L-phone .mnt .scroll,.L-phone .layer .scroll{overflow:visible;columns:auto;padding:4px 12px 12px}
.L-phone .wph{padding:12px 12px 8px}
.L-phone .wph h2{font-size:30px}
.L-phone .lrow{min-height:56px}
.L-phone .wearb{min-height:44px;padding:0 14px}
.L-phone .addhi{width:44px;height:44px}
.L-phone .check{flex-direction:column;flex-wrap:nowrap}
.L-phone .ready,.L-phone .status{flex:none;padding:14px 14px}
.L-phone .ready h2{font-size:36px}
.L-phone .status .score{font-size:96px}
.L-phone .citem{min-height:52px;padding:4px 0}
.L-phone .citem input{width:24px;height:24px}
.L-phone .citem label{font-size:15px;padding:10px 0}
.L-phone .rg .rgh .linkbtn,.L-phone .solid{min-height:44px}
.L-phone .gobtn{min-height:56px}
.dock.ph{--tab-h:64px;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 8px);width:calc(100% - 32px);align-items:stretch}
.pbanner{display:flex;flex-direction:column;gap:8px;padding:10px 10px 10px 14px;background:var(--hi);color:var(--ink);box-shadow:0 8px 24px var(--shadow)}
.pbanner .pr{display:flex;align-items:center;gap:10px}
.pbanner .bt{flex:1 1 auto;min-width:0;font-size:15px;line-height:1.25}
.pbanner .bt b{font-weight:800}
.pbanner .bt small{display:block;font-size:12px}
.pbanner .done{min-height:44px;min-width:76px;border:0;border-radius:2px;background:var(--ink);color:var(--on-dark);font-weight:700;font-size:15px}
.pbanner.selb{background:var(--paper);border-left:4px solid var(--hi)}
.pbanner.selb .done{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.pbags{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.pbags button{flex:none;min-height:44px;padding:4px 12px;border:1px solid var(--ink);border-radius:2px;background:var(--paper);font-size:14px;font-weight:600;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;line-height:1.15}
.pbags button small{font-size:11px;font-weight:400;color:var(--ink-2)}
.pbags button.def{background:var(--ink);color:var(--on-dark)}
.pbags button.def small{color:var(--on-dark-2)}
.dock.ph .toast{min-height:48px}
.dock.ph .toast button{min-height:44px;min-width:64px}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.scrim.anim{animation:fade .15s ease}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:88vh;display:flex;flex-direction:column;background:var(--paper);border-top:4px solid var(--hi);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.anim{animation:up .2s ease}
.sheet .shh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.sheet h2{margin:0;font-size:30px;font-weight:900;text-transform:uppercase;line-height:.9}
.sheet .shb{overflow-y:auto;padding:4px 16px 20px;display:flex;flex-direction:column}
.shsec{padding:14px 0;border-bottom:1px solid var(--line-2);display:flex;flex-direction:column;gap:10px}
.shsec:last-child{border-bottom:0}
.shrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sheet .stepper button{width:48px;height:48px}
.sheet .stepper .val{min-width:96px;font-size:16px}
.sheet .switch{min-height:48px;font-size:16px}
.sheet .seg button{min-height:44px;padding:0 20px;font-size:14px}
.sheet .sets{flex-direction:column}
.sheet .setb{min-height:52px;padding:8px 12px;font-size:15px;text-align:left;align-items:flex-start;flex-direction:column;gap:2px}
.sheet .setb .sl{display:flex;align-items:center;gap:8px;width:100%}
.sheet .setb .sl .meta{margin-left:auto}
.sheet .setb .its{font-size:12px;font-weight:400;opacity:.85;line-height:1.3}
.sheet .linkbtn,.sheet .btn-ink,.sheet .btn-ghost{min-height:44px;padding-left:14px;padding-right:14px;font-size:14px}
.sheet .confirm{padding:8px 8px 8px 12px}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

/* ===== v2 additions ===== */
:root{--c-light:#4C55B0;--c-cook:#B5452F;--c-bags:#1E7A6E;--c-bike:#9B3D8F;--c-lux:#B8935A;--warn-soft:#FFF4D6}
.save[data-state="local"]::before{background:var(--amber)}
.mainnav .navoff{padding:4px 0;color:var(--ink-3);cursor:default}
.mainnav .navoff small{font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin-left:3px}
.big303.m{font-size:112px}.big303.l{font-size:74px;line-height:.86;max-width:620px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.L-tablet .big303.m{font-size:90px}.L-tablet .big303.l{font-size:60px;max-width:440px}
.oct:empty{display:none}
.uwb{border:0;background:transparent;padding:0 2px;font:inherit;color:var(--warn-ink);font-weight:600;text-decoration:underline;text-decoration-color:var(--hi);text-underline-offset:3px;border-radius:2px}
.uwb:hover{background:var(--hi-soft)}
.L-desk.pg{height:auto;min-height:100vh}
/* zone quick "pack here" */
.zpk{position:absolute;z-index:3;transform:translate(-100%,-100%);border:0;border-radius:2px;background:var(--hi);color:var(--ink);font-size:11px;font-weight:700;padding:2px 7px;white-space:nowrap;box-shadow:0 2px 6px var(--shadow)}
.zpk:hover{background:var(--hi-2)}
.pkbtn{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;border:2px solid var(--hi);border-radius:2px;background:var(--hi-softer);font-size:13px;font-weight:700;padding:5px 12px}
.pkbtn:hover{background:var(--hi-soft)}
.pkbtn[aria-pressed="true"]{background:var(--hi);color:var(--ink)}
.pkbtn .dot{width:8px;height:8px;border-radius:50%;background:var(--ink);animation:pulse 1.4s ease-in-out infinite}
.bh .row0{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.phr{display:flex;align-items:center;gap:8px}
.expb{border:0;background:transparent;font-size:12px;font-weight:600;padding:3px 6px;border-radius:2px;color:var(--ink-2);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.expb:hover{background:var(--paper-2);color:var(--ink)}

/* weather */

.pop{position:absolute;top:calc(100% + 6px);left:0;z-index:35;width:340px;max-width:calc(100vw - 32px);background:var(--paper);border:1px solid var(--ink);border-top:4px solid var(--hi);box-shadow:0 12px 30px var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.wxed{display:flex;flex-direction:column;gap:10px}

.presets{display:flex;flex-wrap:wrap;gap:6px}
.pchip{border:1px solid var(--ink);border-radius:2px;background:transparent;font-size:12px;font-weight:600;padding:4px 9px}

.pchip[aria-pressed="true"]{background:var(--ink);color:var(--on-dark)}

.wxline{font-size:13px;padding:8px 10px;background:var(--paper-2);border-left:3px solid var(--c-rain)}

/* suggestions strip */
.sugg{display:flex;align-items:center;gap:10px;min-height:34px;padding:3px 4px 3px 10px;background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--c-sleep);font-size:13px;min-width:0}

/* prompt card in dock */
.prompt{display:flex;align-items:center;gap:10px;padding:8px 6px 8px 12px;background:var(--paper);color:var(--ink);border:1px solid var(--red);border-left:4px solid var(--red);box-shadow:0 8px 24px var(--shadow);font-size:14px;font-weight:600;max-width:100%}

/* drawer (desktop side panel) */

.drawer.anim{animation:slide .18s ease}

.grw{width:100%;display:grid;grid-template-columns:10px minmax(0,1.6fr) 74px 66px minmax(0,.8fr) minmax(0,1.4fr);align-items:center;gap:10px;padding:6px 12px;border:0;border-bottom:1px solid var(--line-2);background:transparent;text-align:left;font-size:14px}

.gtags{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.rt{font-size:11px;padding:0 6px;border:1px solid var(--line);white-space:nowrap;color:var(--ink-2)}

.wchip{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;background:#FFE58A;color:var(--ink);border:1px solid #C9A100;letter-spacing:.04em}
.est{color:var(--ink-3)}

.gear .kpi{display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right}

.gear .kpi .v{font-size:56px;font-weight:900;line-height:.8}
.gear .kpi .v small{font-size:26px;font-weight:800;margin-left:3px}
.gear .kpi.tot .v{font-size:88px}

/* toolbar */

/* shared atoms */

.gear .clr{border:0;background:transparent;font-size:13px;font-weight:600;color:var(--ink);text-decoration:underline;text-decoration-color:var(--hi);text-underline-offset:3px;padding:2px 4px}
.gear .gst{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:1px 6px;white-space:nowrap;line-height:16px}
.gear .gst.s-b{background:var(--hi);color:var(--ink)}
.gear .gst.s-w{border:1px solid var(--ink);color:var(--ink);line-height:14px}
.gear .gst.s-u{border:1px dashed var(--ink-2);color:var(--ink-2);line-height:14px}
.gear .nob{color:var(--ink-2)}
.gear .wish{scroll-margin-top:12px}
.gear .wh{display:flex;align-items:flex-end;justify-content:space-between;gap:8px 20px;flex-wrap:wrap}
.gear .wh h2{margin:0;font-size:44px;font-weight:900;line-height:.85;text-transform:uppercase}
.gear .wh p{margin:4px 0 0;font-size:13px;color:var(--ink-2)}
.gear .wsum{font-size:13px;color:var(--ink-2)}
.gear .wsum b{color:var(--ink);font-weight:600}
.gear .rows{list-style:none;margin:0;padding:0}

/* ===== Ledger ===== */
.gear .a-ov{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(0,1fr);background:var(--paper);border:1px solid var(--line);border-top:2px solid var(--ink)}
.gear .a-ov>section{padding:16px 20px 18px;min-width:0}
.gear .a-ov>section+section{border-left:1px solid var(--line-2)}
.gear .a-ovh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.gear .a-lab{position:relative;height:40px}
.gear .a-lab span{position:absolute;bottom:0;padding:0 6px 3px 6px;border-left:1px solid var(--ink);font-size:12px;white-space:nowrap;line-height:1.15;z-index:2;background:var(--paper)}
.gear .a-lab span.hi2{bottom:19px;z-index:1}
.gear .a-lab span.hi2::before{content:"";position:absolute;left:-1px;top:100%;height:19px;border-left:1px solid var(--ink)}
.gear .a-lab b{font-weight:600}
.gear .a-lab i{font-style:normal;color:var(--ink-2)}
.gear .a-bar{display:flex;gap:2px;height:30px;background:var(--paper)}
.gear .a-seg{flex-basis:0;min-width:2px;border:0;padding:0;border-radius:0;transition:opacity .12s}
.gear .a-bar:hover .a-seg{opacity:.55}
.gear .a-bar .a-seg:hover,.gear .a-bar .a-seg:focus-visible{opacity:1}
.gear .a-bar.f .a-seg{opacity:.3}
.gear .a-bar.f .a-seg.on{opacity:1;box-shadow:inset 0 -4px 0 var(--ink)}
.gear .a-scale{position:relative;height:20px;border-top:1px solid var(--ink);margin-top:4px}
.gear .a-scale span{position:absolute;top:3px;font-size:11px;color:var(--ink-2);transform:translateX(-50%);white-space:nowrap}
.gear .a-scale span::before{content:"";position:absolute;left:50%;top:-4px;height:4px;border-left:1px solid var(--ink)}
.gear .a-scale span:first-child{transform:none}
.gear .a-scale span:first-child::before{left:0}
.gear .a-scale span.last{transform:translateX(-100%)}
.gear .a-scale span.last::before{left:100%}
.gear .a-leg{display:grid;grid-template-columns:1fr 1fr;column-gap:28px;margin-top:10px}
.gear .a-lgh,.gear .a-lg{display:grid;grid-template-columns:12px minmax(0,1fr) 40px 70px 40px;align-items:baseline;gap:8px;padding:5px 4px}
.gear .a-lgh{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);border-bottom:2px solid var(--ink);padding-top:0}
.gear .a-lgh span:nth-child(n+3){text-align:right}
.gear .a-lg{width:100%;border:0;border-bottom:1px solid var(--line-2);background:transparent;text-align:left;font-size:13px}
.gear .a-lg:hover{background:var(--paper-2)}
.gear .a-lg[aria-pressed="true"]{background:var(--hi-softer);box-shadow:inset 0 -2px 0 var(--hi)}
.gear .a-lg .sw{align-self:center}
.gear .a-lg .n{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.gear .a-lg .n span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gear .a-lg .n small{font-size:11px;color:var(--ink-2)}
.gear .a-lg .r{text-align:right;color:var(--ink-2)}
.gear .a-lg .k{text-align:right;font-weight:600;white-space:nowrap}
.gear .a-top{list-style:none;margin:0;padding:0}
.gear .a-top li+li{border-top:1px solid var(--line-2)}
.gear .a-top button{width:100%;display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 4px;border:0;background:transparent;text-align:left}
.gear .a-top button:hover{background:var(--paper-2)}
.gear .a-rk{font-size:26px;font-weight:900;line-height:.8;color:var(--ink-2)}
.gear .a-top li:first-child .a-rk{color:var(--hi)}
.gear .a-tn{display:flex;flex-direction:column;min-width:0;gap:2px;font-size:14px;line-height:1.15}
.gear .a-tn>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gear .a-tn small{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-2);min-width:0;white-space:nowrap;overflow:hidden}
.gear .a-tn .trule{display:block;height:2px;background:var(--track);margin-top:2px}
.gear .a-tn .trule i{display:block;height:100%;background:var(--ink)}
.gear .a-tw{font-size:22px;font-weight:800;line-height:.9;white-space:nowrap}
.gear .a-tw small{font-size:.66em;font-weight:700;margin-left:2px}
.gear .a-ledger{columns:2;column-gap:28px}
.gear .a-cat{break-inside:avoid;background:var(--paper);border:1px solid var(--line);margin:0 0 20px;scroll-margin-top:12px}
.gear .a-ch{display:flex;align-items:baseline;gap:9px;padding:10px 12px 8px;border-bottom:2px solid var(--ink)}
.gear .a-ch h3{margin:0;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.gear .a-ch .sw{align-self:center}
.gear .a-ch .m{margin-left:auto;font-size:12px;color:var(--ink-2);white-space:nowrap}
.gear .a-ch .k{font-size:20px;font-weight:800;line-height:.8;color:var(--ink);margin-left:8px;white-space:nowrap}
.gear .a-ch .k small{font-size:.66em;margin-left:2px}
.gear .a-colh{display:grid;grid-template-columns:minmax(0,1fr) 128px 76px;gap:10px;padding:5px 12px 3px;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);border-bottom:1px solid var(--line-2)}
.gear .a-colh span:last-child{text-align:right}
.gear .a-row{width:100%;display:grid;grid-template-columns:minmax(0,1fr) 128px 76px;gap:10px;align-items:baseline;padding:6px 12px;border:0;border-bottom:1px solid var(--line-2);background:transparent;text-align:left;font-size:14px}
.gear .rows li:last-child .a-row{border-bottom:0}
.gear .a-row:hover{background:var(--paper-2)}
.gear .a-row .nm{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gear .a-row .bg{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gear .a-row .w{text-align:right;white-space:nowrap;font-size:14px}
.gear .a-tiles{display:flex;flex-direction:column;gap:22px}
.gear .a-tcat{scroll-margin-top:12px}
.gear .a-tcat .a-ch{background:transparent;padding-left:0;padding-right:0}
.gear .a-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:6px;list-style:none;margin:8px 0 0;padding:0}
.gear .a-card{width:100%;height:86px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;padding:8px 10px;background:var(--paper);border:1px solid var(--line);text-align:left;position:relative}

.gear .a-card .nm{font-size:13px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding-right:12px}
.gear .a-card .ft{display:flex;justify-content:space-between;align-items:baseline;gap:6px;min-width:0}
.gear .a-card .bg{font-size:11px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.gear .a-card .w{font-size:20px;font-weight:800;line-height:.9;white-space:nowrap}
.gear .a-card .w small{font-size:.66em;font-weight:700;margin-left:2px}
.gear .a-card .sw{position:absolute;top:9px;right:9px;width:6px;height:6px}
.gear .a-card.un{background:var(--paper-45);border-style:dashed}
.gear .a-wish{background:var(--paper-45);border:1px dashed var(--ink-3);padding:18px 20px 16px;display:flex;flex-direction:column;gap:14px}
.gear .a-wb{width:100%;display:grid;grid-template-columns:96px minmax(0,1.6fr) minmax(0,1fr) 150px 90px;gap:10px;align-items:baseline;padding:7px 0;border:0;border-bottom:1px solid var(--line-2);background:transparent;text-align:left;font-size:14px}
.gear .rows li:last-child .a-wb{border-bottom:0}
.gear .a-wb:hover{background:var(--paper-70)}
.gear .a-wb .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gear .a-wb .c{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);min-width:0;white-space:nowrap;overflow:hidden}
.gear .a-wb .bg{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gear .a-wb .w{text-align:right;white-space:nowrap}
.gear .a-whd{display:grid;grid-template-columns:96px minmax(0,1.6fr) minmax(0,1fr) 150px 90px;gap:10px;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);padding:0 0 4px;border-bottom:2px solid var(--ink)}
.gear .a-whd span:last-child{text-align:right}

/* ===== Board ===== */
.gear .b-ov{background:var(--paper);border:1px solid var(--line);border-top:2px solid var(--ink);display:flex;flex-direction:column}
.gear .b-ov>section{padding:16px 20px 18px}
.gear .b-ov>section+section{border-top:1px solid var(--line-2)}
.gear .b-ovh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.gear .b-cols{display:flex;align-items:stretch;gap:6px}
.gear .b-col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;padding:0;border:0;background:transparent;text-align:left}
.gear .b-col .val{font-size:18px;font-weight:800;line-height:1;padding:0 0 4px 2px;white-space:nowrap}
.gear .b-col .val small{font-size:12px;font-weight:700;margin-left:1px}
.gear .b-col .col{display:block;background:var(--ink);border-top:4px solid;min-height:4px;transition:background .12s}
.gear .b-col:hover .col{background:var(--dark-2)}
.gear .b-col[aria-pressed="true"] .col{background:var(--hi);border-top-color:var(--ink)!important}
.gear .b-col[aria-pressed="true"] .ft{box-shadow:inset 0 -3px 0 var(--hi)}
.gear .b-col .ft{display:flex;flex-direction:column;gap:1px;padding:6px 2px 4px;border-top:1px solid var(--ink);min-height:50px}
.gear .b-col .ft span{font-size:11px;font-weight:600;line-height:1.15;letter-spacing:.02em;overflow-wrap:anywhere}
.gear .b-col .ft small{font-size:10px;color:var(--ink-2);line-height:1.2}
.gear .b-colwrap{height:150px;display:flex;flex-direction:column;justify-content:flex-end}
.gear .b-strip{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:8px;align-items:end;list-style:none;margin:0;padding:0}
.gear .b-strip li{display:contents}
.gear .b-st{width:100%;display:flex;flex-direction:column;justify-content:space-between;padding:8px 9px 9px;border:1px solid var(--ink);background:var(--paper);text-align:left;box-shadow:3px 3px 0 var(--wash-ink-2);position:relative;min-width:0}
.gear .b-st:hover{background:var(--hi-softer)}
.gear .b-st .rk{font-size:38px;font-weight:900;line-height:.75;color:var(--ink)}
.gear .b-strip li:first-child .b-st .rk{color:var(--hi)}
.gear .b-st .nm{font-size:12px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-top:6px;overflow-wrap:break-word}
.gear .b-st .w{font-size:22px;font-weight:800;line-height:.9;margin-top:6px;white-space:nowrap}
.gear .b-st .w small{font-size:.66em;margin-left:2px}
.gear .b-st .sw{position:absolute;top:9px;right:9px;width:7px;height:7px}
.gear .b-board{background-color:var(--paper-2);background-image:linear-gradient(var(--wash-ink) 1px,transparent 1px),linear-gradient(90deg,var(--wash-ink) 1px,transparent 1px);background-size:24px 24px;border:1px solid var(--line)}
.gear .b-blk{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;padding:22px 24px 26px;scroll-margin-top:12px}
.gear .b-blk+.b-blk{border-top:1px dashed var(--line)}
.gear .b-rail{display:flex;flex-direction:column;gap:6px;min-width:0}
.gear .b-rail h3{margin:0;font-size:30px;font-weight:900;line-height:.86;text-transform:uppercase;overflow-wrap:break-word}
.gear .b-rail .k{font-size:40px;font-weight:900;line-height:.8;margin-top:6px;white-space:nowrap}
.gear .b-rail .k small{font-size:.45em;font-weight:800;margin-left:2px}
.gear .b-rail .m{font-size:12px;color:var(--ink-2);line-height:1.35}
.gear .b-rail .sw{width:14px;height:14px}
.gear .b-mat{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));grid-auto-rows:80px;grid-auto-flow:dense;gap:8px;list-style:none;margin:0;padding:0}
.gear .b-mat li{display:contents}
.gear .b-t{position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:7px 8px;border:1px solid var(--ink-3);background:var(--paper);text-align:left;box-shadow:2px 2px 0 var(--wash-ink-2);overflow:hidden;min-width:0}
.gear .b-t:hover{border-color:var(--ink);box-shadow:3px 3px 0 var(--wash-ink-2);background:#FBFCF8}
.gear .b-t .nm{font-size:11px;line-height:1.15;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;padding-right:8px;overflow-wrap:break-word;hyphens:auto}
.gear .b-t .w{font-size:16px;font-weight:800;line-height:.9;white-space:nowrap}
.gear .b-t .w small{font-size:.66em;margin-left:2px}
.gear .b-t .bg{display:none;font-size:11px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.gear .b-t .ft{display:flex;align-items:baseline;justify-content:space-between;gap:6px;min-width:0}
.gear .b-t .sw{position:absolute;top:8px;right:8px;width:6px;height:6px}
.gear .b-t.m{grid-column:span 2}
.gear .b-t.l{grid-column:span 2;grid-row:span 2;padding:10px 11px}
.gear .b-t.m .nm{font-size:12px;-webkit-line-clamp:2}
.gear .b-t.l .nm{font-size:14px;-webkit-line-clamp:4}
.gear .b-t.m .w{font-size:22px}
.gear .b-t.l .w{font-size:40px}
.gear .b-t.l .w small{font-size:.5em}
.gear .b-t.m .bg,.gear .b-t.l .bg{display:block}
.gear .b-t.l .ft{flex-direction:column;align-items:flex-start;gap:4px}
.gear .b-t.un{background:transparent;border-style:dashed;box-shadow:none}
.gear .b-t.un .nw{font-size:10px;padding:0 4px;line-height:15px}
.gear .b-key{display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);padding:12px 24px 0}
.gear .b-key span{display:inline-flex;align-items:center;gap:6px}
.gear .b-key i{display:inline-block;border:1px solid var(--ink-3);background:var(--paper)}
.gear .b-list{background:var(--paper);border:1px solid var(--line)}
.gear .b-lh{display:flex;align-items:baseline;gap:9px;padding:9px 14px 7px;border-bottom:2px solid var(--ink);background:var(--paper-2);scroll-margin-top:12px}
.gear .b-lh h3{margin:0;font-size:22px;font-weight:900;text-transform:uppercase;line-height:1}
.gear .b-lh .sw{align-self:center}
.gear .b-lh .m{margin-left:auto;font-size:12px;color:var(--ink-2)}
.gear .b-lh .m b{color:var(--ink);font-weight:600}
.gear .b-row{width:100%;display:grid;grid-template-columns:minmax(0,1fr) 200px 100px;gap:14px;align-items:baseline;padding:7px 14px;border:0;border-bottom:1px solid var(--line-2);background:transparent;text-align:left;font-size:14px}
.gear .b-row:hover{background:var(--paper-2)}
.gear .b-row .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gear .b-row .bg{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gear .b-row .w{text-align:right;font-weight:600;white-space:nowrap}
.gear .b-wish{border:2px dashed var(--ink-3);padding:20px 24px 24px;display:flex;flex-direction:column;gap:16px;background:transparent}
.gear .b-t.ghost{background:transparent;border:1.5px dashed var(--ink-2);box-shadow:none;padding-top:24px}
.gear .b-t.ghost .gst{position:absolute;top:6px;left:7px}
.gear .b-t.ghost:hover{background:var(--paper-70)}

/* ===== tablet ===== */
.L-tablet .gear .kpis{gap:22px}
.L-tablet .gear .kpi .v{font-size:44px}
.L-tablet .gear .kpi.tot .v{font-size:66px}
.L-tablet .gear .kpi.wl .v{font-size:44px}
.L-tablet .gear .a-ov{grid-template-columns:minmax(0,1fr)}
.L-tablet .gear .a-ov>section+section{border-left:0;border-top:1px solid var(--line-2)}
.L-tablet .gear .a-colh,.L-tablet .gear .a-row{grid-template-columns:minmax(0,1fr) 104px 70px}

    if (!GEAR[id]) return;
    var unusedAll = last3.filter(function (x) { return x.d.items && x.d.items[id] === 'unused'; });
    if (unusedAll.length < 2) return;
    var comparable = unusedAll.filter(function (x) {
      var c = x.d.cond || {};
      if (WARM[id] || GEAR[id].set === 'warm') {
        if (wxSet(plan) && typeof c.min === 'number') return c.min <= plan.min + 3;
        if (!wxSet(plan) && typeof c.max === 'number' && c.max >= 25) return false;
      }
      if (RAINY[id] && plan && plan.rain && plan.rain !== 'none' && c.rain === false) return false;
      return true;
    });
    if (comparable.length >= 2) {
      out.push({ sid: 'lv:' + id, src: 'debrief', title: 'Leave ' + nm(id) + ' at home?', why: 'Not used on ' + listNames(comparable.map(function (x) { return x.name + (tempTxt(x.d.cond) ? ' (' + tempTxt(x.d.cond) + ')' : ''); })),
        btn: 'Leave at home', act: { t: 'unpack', ids: [id] } });

      out.push({ sid: 'ms:' + id, src: 'debrief', title: 'Pack ' + nm(id) + '?', why: 'You missed it on ' + x.name, btn: 'Pack it', act: { t: 'add', ids: [id] } });
    });
  });
  // 3. from Noah's notes (high priority rules with item ids)
  RULES.forEach(function (r) {
    var sd = SEEDS[r[0]];
    if (!sd || r[6] !== 'high' || !r[4].length) return;
    var src = 'From your notes · ' + r[5];
    if (sd.info) { if (full) out.push({ sid: 'nt:' + r[0], src: src, info: true, title: r[3], why: r[2] }); return; }
    if (sd.cold && !isColdRide()) return;
    if (sd.seat) {
      if (P.setup.seat !== sd.seat) out.push({ sid: 'nt:' + r[0], src: src, title: 'Use the seat pack instead of the Tailfin?', why: r[2], btn: 'Switch', act: { t: 'seat', opt: sd.seat } });
      return;
    }
    var un = (sd.unpack || []).filter(function (id) { return packed[id]; });
    if (un.length) { out.push({ sid: 'nt:' + r[0] + 'u', src: src, title: 'Leave ' + listNames(un.map(nm)) + ' at home?', why: r[2], btn: 'Leave at home', act: { t: 'unpack', ids: un } }); return; }
    if (sd.night && !P.night) return;
    var add = (sd.add || []).filter(function (id) { return GEAR[id] && GEAR[id].packable && !packed[id]; });
    if (add.length) out.push({ sid: 'nt:' + r[0], src: src, title: 'Pack ' + listNames(add.map(nm)) + '?', why: (sd.lead ? sd.lead + ' ' : '') + r[2], btn: add.length > 1 ? 'Pack all' : 'Pack it', act: { t: 'add', ids: add } });
  });

  out.forEach(function (s) { s.dismissed = dis.indexOf(s.sid) >= 0; });

}

<!-- ---------- Pack Generator: backup dialog ---------- -->
<style>
[data-save]{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}

.pg-backup p{margin:0 0 14px;color:var(--ink-2);line-height:1.4}
.pg-backup .row{display:flex;flex-wrap:wrap;gap:8px}
.pg-backup button,.pg-backup label.pg-btn{font:600 15px "Fira Sans",sans-serif;padding:10px 14px;border-radius:4px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}

</style>
<dialog class="pg-backup" id="pg-backup" aria-labelledby="pg-backup-title">
  <h2 id="pg-backup-title">Backup</h2>
  <p>All rides, gear changes and debriefs live only in this browser. Export a backup file regularly and import it on your other device.</p>
  <p data-pg-last></p>
  <div class="row">
    <button type="button" class="pg-hi" data-pg="export">Export backup</button>
    <label class="pg-btn">Import backup<input type="file" accept="application/json,.json" data-pg="import" hidden></label>
    <button type="button" data-pg="close">Close</button>
  </div>
  <p class="pg-msg" data-pg-msg role="status"></p>
</dialog>
<script>
(function () {
  'use strict';
  var KEY = 'bikeCockpit.v2', LAST = 'bikeCockpit.lastExport', APP = 'bike-cockpit-backup';
  var dlg = document.getElementById('pg-backup');
  var msg = dlg.querySelector('[data-pg-msg]');

  function lastText() {

  }
